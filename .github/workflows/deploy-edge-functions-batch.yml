name: Deploy Supabase Edge Functions (batch)

# Deploys several edge functions in one run. Each function keeps the
# verify_jwt setting it currently has in production (read from the
# Supabase Management API), so a redeploy never changes who can call it.

on:
  workflow_dispatch:
    inputs:
      function_names:
        description: 'Space-separated edge function names to deploy'
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: fytxfdvbzstnimzhjgth
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy functions
        run: |
          failed=""
          for fn in ${{ github.event.inputs.function_names }}; do
            echo "::group::$fn"
            live=$(curl -s -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              "https://api.supabase.com/v1/projects/$PROJECT_REF/functions/$fn" | jq -r '.verify_jwt // empty')
            flag=""
            if [ "$live" = "false" ]; then
              flag="--no-verify-jwt"
            elif [ -z "$live" ]; then
              echo "No live function named $fn; using config.toml setting"
            fi
            echo "live verify_jwt=$live"
            if ! supabase functions deploy "$fn" --project-ref "$PROJECT_REF" $flag --yes; then
              failed="$failed $fn"
            fi
            echo "::endgroup::"
          done
          if [ -n "$failed" ]; then
            echo "Failed:$failed"
            exit 1
          fi
          echo "All functions deployed."
